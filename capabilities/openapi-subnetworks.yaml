naftiko: 1.0.0-alpha2
info:
  label: Google Cloud VPC API — Subnetworks
  description: 'Google Cloud VPC API — Subnetworks. 1 operations. Lead operation: Google Cloud VPC List subnetworks. Self-contained
    Naftiko capability covering one Google Cloud Vpc business surface.'
  tags:
  - Google Cloud Vpc
  - Subnetworks
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    GOOGLE_CLOUD_VPC_API_KEY: GOOGLE_CLOUD_VPC_API_KEY
capability:
  consumes:
  - type: http
    namespace: openapi-subnetworks
    baseUri: https://compute.googleapis.com/compute/v1
    description: Google Cloud VPC API — Subnetworks business capability. Self-contained, no shared references.
    resources:
    - name: projects-project-regions-region-subnetworks
      path: /projects/{project}/regions/{region}/subnetworks
      operations:
      - name: listsubnetworks
        method: GET
        description: Google Cloud VPC List subnetworks
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: project
          in: path
          type: string
          required: true
        - name: region
          in: path
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.GOOGLE_CLOUD_VPC_API_KEY}}'
  exposes:
  - type: rest
    namespace: openapi-subnetworks-rest
    port: 8080
    description: REST adapter for Google Cloud VPC API — Subnetworks. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/projects/{project}/regions/{region}/subnetworks
      name: projects-project-regions-region-subnetworks
      description: REST surface for projects-project-regions-region-subnetworks.
      operations:
      - method: GET
        name: listsubnetworks
        description: Google Cloud VPC List subnetworks
        call: openapi-subnetworks.listsubnetworks
        with:
          project: rest.project
          region: rest.region
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: openapi-subnetworks-mcp
    port: 9090
    transport: http
    description: MCP adapter for Google Cloud VPC API — Subnetworks. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: google-cloud-vpc-list-subnetworks
      description: Google Cloud VPC List subnetworks
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: openapi-subnetworks.listsubnetworks
      with:
        project: tools.project
        region: tools.region
      outputParameters:
      - type: object
        mapping: $.
