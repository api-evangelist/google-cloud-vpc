      description: REST surface for projects-project-global-networks-network.
      operations:
      - method: GET
        name: getnetwork
        description: Google Cloud VPC Get a VPC network
        call: openapi-networks.getnetwork
        with:
          project: rest.project
          network: rest.network
        outputParameters:
        - type: object
          mapping: $.
