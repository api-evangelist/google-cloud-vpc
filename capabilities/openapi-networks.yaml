    resources:
    - name: projects-project-global-networks
      path: /projects/{project}/global/networks
      operations:
      - name: listnetworks
        method: GET
        description: Google Cloud VPC List VPC networks
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: project
          in: path
          type: string
          required: true
      - name: createnetwork
        method: POST
        description: Google Cloud VPC Create a VPC network
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: project
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: projects-project-global-networks-network
      path: /projects/{project}/global/networks/{network}
      operations:
      - name: getnetwork
        method: GET
        description: Google Cloud VPC Get a VPC network
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: project
          in: path
          type: string
          required: true
        - name: network
          in: path
          type: string
          required: true
      - name: deletenetwork
