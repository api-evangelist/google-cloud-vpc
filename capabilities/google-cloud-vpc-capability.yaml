        name: listfirewalls
        description: Google Cloud VPC List firewall rules
        call: google-cloud-vpc.listfirewalls
        with:
          project: rest.project
        outputParameters:
        - type: object
          mapping: $.
    - path: /projects/{project}/global/routes
      name: listroutes
