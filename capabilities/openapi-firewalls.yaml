naftiko: 1.0.0-alpha2
info:
  label: Google Cloud VPC API — Firewalls
  description: 'Google Cloud VPC API — Firewalls. 1 operations. Lead operation: Google Cloud VPC List firewall rules. Self-contained
    Naftiko capability covering one Google Cloud Vpc business surface.'
  tags:
  - Google Cloud Vpc
  - Firewalls
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    GOOGLE_CLOUD_VPC_API_KEY: GOOGLE_CLOUD_VPC_API_KEY
capability:
  consumes:
  - type: http
    namespace: openapi-firewalls
    baseUri: https://compute.googleapis.com/compute/v1
    description: Google Cloud VPC API — Firewalls business capability. Self-contained, no shared references.
    resources:
    - name: projects-project-global-firewalls
      path: /projects/{project}/global/firewalls
      operations:
      - name: listfirewalls
        method: GET
        description: Google Cloud VPC List firewall rules
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: project
          in: path
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.GOOGLE_CLOUD_VPC_API_KEY}}'
  exposes:
  - type: rest
    namespace: openapi-firewalls-rest
    port: 8080
    description: REST adapter for Google Cloud VPC API — Firewalls. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/projects/{project}/global/firewalls
      name: projects-project-global-firewalls
      description: REST surface for projects-project-global-firewalls.
      operations:
      - method: GET
        name: listfirewalls
        description: Google Cloud VPC List firewall rules
        call: openapi-firewalls.listfirewalls
        with:
          project: rest.project
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: openapi-firewalls-mcp
    port: 9090
    transport: http
    description: MCP adapter for Google Cloud VPC API — Firewalls. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: google-cloud-vpc-list-firewall
      description: Google Cloud VPC List firewall rules
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: openapi-firewalls.listfirewalls
      with:
        project: tools.project
      outputParameters:
      - type: object
        mapping: $.
